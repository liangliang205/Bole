services:
  bole:
    build: .
    container_name: bole-mvp
    environment:
      # mock：离线确定性演示；deepseek：接入真实模型（需 DEEPSEEK_API_KEY）
      BOLE_LLM: ${BOLE_LLM:-mock}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      NO_COLOR: "1"
    volumes:
      - bole-runs:/app/runs
      - bole-data:/app/data
    command: ["node", "src/cli/index.ts", "demo", "--yes"]

volumes:
  bole-runs:
  bole-data:
