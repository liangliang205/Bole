services:
  bole:
    build: .
    container_name: bole-mvp
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      BOLE_OCR_DIR: /app/ocr
      NO_COLOR: "1"
    ports:
      - "8787:8787"
    volumes:
      - bole-runs:/app/runs
      - bole-data:/app/data
    restart: unless-stopped

volumes:
  bole-runs:
  bole-data:
