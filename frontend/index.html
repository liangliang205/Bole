<title>伯乐 BoLe · 对话式招聘筛选</title>
<script>
(() => {
  try {
    document.documentElement.dataset.theme = localStorage.getItem('bole.theme') === 'dark' ? 'dark' : 'light';
  } catch {
    document.documentElement.dataset.theme = 'light';
  }
})();
</script>
