# Requires Docker Compose >= 2.24.4.
services:
  bole:
    ports: !reset []
  gateway:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on:
      bole:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      BOLE_DOMAIN: ${BOLE_DOMAIN:?Set BOLE_DOMAIN}
      BOLE_AUTH_USER: ${BOLE_AUTH_USER:?Set BOLE_AUTH_USER}
      BOLE_AUTH_HASH: ${BOLE_AUTH_HASH:?Set BOLE_AUTH_HASH}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
volumes:
  caddy-data:
  caddy-config:
